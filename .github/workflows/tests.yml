# اجرای خودکار سوئیت تست‌های یکپارچه با هر پوش / پول‌ریکوئست
# تست‌ها روی SQLite درون‌حافظه اجرا می‌شوند و به سرویس خارجی نیاز ندارند.
name: تست‌های یکپارچه

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:

jobs:
  integration:
    name: سوئیت کامل (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, curl
          coverage: none

      - name: بررسی نسخه
        run: php -v

      - name: اجرای سوئیت تست‌ها
        run: php tests/Integration/run.php
        env:
          APP_ENV: testing
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long-0123456789
